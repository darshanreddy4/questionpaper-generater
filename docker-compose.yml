services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: examforge
      POSTGRES_USER: examforge
      POSTGRES_PASSWORD: ${EXAMFORGE_DB_PASSWORD:?set EXAMFORGE_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - examforge-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examforge -d examforge"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  examforge-pg:
